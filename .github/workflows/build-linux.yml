name: Build Linux AppImage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-linux.yml'
      - 'core/**'
      - 'electron/**'
      - 'scripts/**'
      - 'src/**'
      - 'assets/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron and AppImage build tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-appimage-${{ hashFiles('package-lock.json') }}-toolset-1.0.3

      - name: Build AppImage
        id: build
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "AppImage build attempt ${attempt}/3"
            if npm run build:appimage 2>&1 | tee "build-${attempt}.log"; then
              cp "build-${attempt}.log" build.log
              exit 0
            fi
            cp "build-${attempt}.log" build.log
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Show build failure details
        if: failure() && steps.build.outcome == 'failure'
        run: |
          error_text="$(tail -n 20 build.log | tr '\n' ' ' | cut -c1-4000)"
          printf '::error title=Linux package build failed::%s\n' "$error_text"
          {
            echo '## Linux build failure details'
            echo '```text'
            tail -n 100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AppImage for download
        uses: actions/upload-artifact@v7
        with:
          name: Word-Properties-Editor-Linux-AppImage
          path: release/*.AppImage
          if-no-files-found: error
          archive: false
