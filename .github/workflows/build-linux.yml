name: Build Linux AppImage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-linux.yml'
      - 'core/**'
      - 'electron/**'
      - 'scripts/**'
      - 'src/**'
      - 'assets/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        id: build
        run: |
          set -o pipefail
          npm run build:linux 2>&1 | tee build.log

      - name: Show build failure details
        if: failure() && steps.build.outcome == 'failure'
        run: |
          error_text="$(tail -n 20 build.log | tr '\n' ' ' | cut -c1-4000)"
          printf '::error title=Linux package build failed::%s\n' "$error_text"
          {
            echo '## Linux build failure details'
            echo '```text'
            tail -n 100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach AppImage to the v1.0.0 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          files: release/*.AppImage
          fail_on_unmatched_files: true
