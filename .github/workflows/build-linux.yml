name: Build Linux AppImage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-linux.yml'
      - 'core/**'
      - 'electron/**'
      - 'scripts/**'
      - 'src/**'
      - 'assets/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron and AppImage build tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-appimage-${{ hashFiles('package-lock.json') }}-toolset-1.0.3

      - name: Download verified AppImage tools
        env:
          APPIMAGE_TOOLS_SHA256: 84021a78ee214ae6fd33a2d62a92ba25542dd10bc86bf117a9b2d0bba44e7665
        run: |
          archive="$RUNNER_TEMP/appimage-tools-runtime-20251108.tar.gz"
          tools_dir="$RUNNER_TEMP/appimage-tools"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 300 \
            'https://github.com/electron-userland/electron-builder-binaries/releases/download/appimage%401.0.3/appimage-tools-runtime-20251108.tar.gz' \
            --output "$archive"
          echo "$APPIMAGE_TOOLS_SHA256  $archive" | sha256sum --check --status
          mkdir -p "$tools_dir"
          tar -xzf "$archive" -C "$tools_dir"
          test -x "$tools_dir/mksquashfs"
          test -x "$tools_dir/desktop-file-validate"
          echo "APPIMAGE_TOOLS_PATH=$tools_dir" >> "$GITHUB_ENV"

      - name: Build AppImage
        id: build
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "AppImage build attempt ${attempt}/3"
            if npm run build:appimage 2>&1 | tee "build-${attempt}.log"; then
              cp "build-${attempt}.log" build.log
              exit 0
            fi
            cp "build-${attempt}.log" build.log
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Show build failure details
        if: failure() && steps.build.outcome == 'failure'
        run: |
          error_text="$(tail -n 20 build.log | tr '\n' ' ' | cut -c1-4000)"
          printf '::error title=Linux package build failed::%s\n' "$error_text"
          {
            echo '## Linux build failure details'
            echo '```text'
            tail -n 100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AppImage for download
        uses: actions/upload-artifact@v7
        with:
          name: Word-Properties-Editor-Linux-AppImage
          path: release/*.AppImage
          if-no-files-found: error
          archive: false
